<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勤怠打刻</title>
    <style>
      :root{--green:#0f766e;--green-d:#0d5f58;--bg1:#ecfdf5;--bg2:#f0f9ff;--line:#e2e8f0;--muted:#64748b;--red:#dc2626;--amber:#b45309;}
      *{box-sizing:border-box;}
      body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#0f172a;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;}
      header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
      header .title{color:var(--green);font-weight:700;font-size:17px;}
      header .clock{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;}
      .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
      .card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(15,118,110,.08);padding:22px;margin-bottom:16px;}
      h1{font-size:20px;color:var(--green);margin:0 0 4px;}
      .sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
      button{cursor:pointer;border:none;border-radius:12px;font-size:16px;font-weight:700;padding:14px 18px;width:100%;}
      .btn-green{background:var(--green);color:#fff;}.btn-green:active{background:var(--green-d);}
      .btn-amber{background:#f59e0b;color:#fff;}
      .btn-gray{background:#f1f5f9;color:#334155;}
      .btn-red{background:#ef4444;color:#fff;}
      .row2{display:flex;gap:10px;}
      .staff-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
      .staff-row:last-child{border-bottom:none;}
      .staff-btn{flex:1;text-align:left;background:#f8fafc;border:1px solid var(--line);color:#0f172a;font-size:17px;padding:14px 16px;}
      .hist-btn{width:auto;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;padding:12px 14px;}
      .hint{color:var(--muted);font-size:14px;text-align:center;padding:8px 0;}
      .big-name{font-size:24px;font-weight:800;margin:0 0 2px;}
      .status{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin:14px 0;font-size:15px;line-height:1.9;}
      .status .lbl{color:var(--muted);font-size:12px;}
      .badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;}
      .b-work{background:#dcfce7;color:#166534;}.b-break{background:#fef3c7;color:var(--amber);}.b-done{background:#e2e8f0;color:#475569;}.b-before{background:#e0f2fe;color:#075985;}
      .msg{padding:11px 13px;border-radius:10px;font-size:14px;margin-top:12px;display:none;white-space:pre-wrap;}
      .msg.ok{background:#f0fdf4;color:#166534;display:block;}.msg.err{background:#fef2f2;color:var(--red);display:block;}
      .link{color:var(--muted);font-size:14px;cursor:pointer;display:inline-block;margin-bottom:6px;}
      .pin-dots{font-size:28px;letter-spacing:8px;text-align:center;margin:10px 0;color:var(--green);min-height:34px;}
      .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
      .keypad button{background:#f8fafc;border:1px solid var(--line);color:#0f172a;font-size:22px;padding:16px 0;}
      .center{text-align:center;}
      table{width:100%;border-collapse:collapse;}
      th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;}
      th{color:var(--muted);font-size:12px;}
      .gate{max-width:420px;margin:70px auto;text-align:center;}
    </style>
  </head>
  <body>
    <header>
      <span class="title">ヤマネ整体院</span>
      <span class="clock" id="clock"></span>
    </header>
    <div class="wrap" id="app"></div>

    <script>
      const SUPABASE_URL="https://jzpabxeiibvmntvhrqgq.supabase.co";
      const SUPABASE_KEY="sb_publishable_qt5siXfhpm_NsgpMZxIL0w_YALYpb6B";
      const REST=SUPABASE_URL+"/rest/v1";
      const H={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};

      const $=id=>document.getElementById(id);
      const pad=n=>String(n).padStart(2,"0");
      const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
      const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
      const toMin=s=>{if(!s)return null;const[h,m]=String(s).split(":").map(Number);return h*60+m;};
      function workMin(rec){const n=(rec&&rec.slots)||{};
        if(n.in||n.out){const i=toMin(n.in),o=toMin(n.out);if(i==null||o==null)return 0;let w=Math.max(0,o-i);
          if(Array.isArray(n.breaks))for(const b of n.breaks){const bs=toMin(b.s),be=toMin(b.e);if(bs!=null&&be!=null)w-=Math.max(0,be-bs);}
          if(n.break_min)w-=Number(n.break_min)||0;return Math.max(0,w);}
        let r=0;if(toMin(n.am_in)!=null&&toMin(n.am_out)!=null)r+=Math.max(0,toMin(n.am_out)-toMin(n.am_in));
        if(toMin(n.pm_in)!=null&&toMin(n.pm_out)!=null)r+=Math.max(0,toMin(n.pm_out)-toMin(n.pm_in));return r;}
      const fmtHM=m=>(m?Math.floor(m/60)+"時間"+pad(m%60)+"分":"0時間00分");

      // 時計
      function tick(){const d=new Date();$("clock").textContent=d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
      tick();setInterval(tick,10000);

      // 端末登録チェック
      function deviceOK(){const h=location.hostname;if(h==="localhost"||h==="127.0.0.1")return true;try{return localStorage.getItem("kintai_device")==="OK";}catch(e){return false;}}

      let staff=[];
      async function loadStaff(){const r=await fetch(REST+"/staff_list?select=id,name,pin&order=name",{headers:H});if(!r.ok)throw new Error("読み込み失敗");return await r.json();}
      async function getToday(name){const r=await fetch(REST+"/punch_records?select=*&date=eq."+todayStr()+"&staff=eq."+encodeURIComponent(name),{headers:H});if(!r.ok)throw new Error("取得失敗");const a=await r.json();return a[0]||null;}
      async function getMonth(name){const mo=todayStr().slice(0,7);const r=await fetch(REST+"/punch_records?select=*&staff=eq."+encodeURIComponent(name)+"&date=like."+mo+"*&order=date.desc",{headers:H});if(!r.ok)throw new Error("取得失敗");return await r.json();}
      async function saveRec(name,slots){const body=[{date:todayStr(),staff:name,pattern:"day",slots}];const r=await fetch(REST+"/punch_records?on_conflict=date,staff",{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(body)});if(!r.ok)throw new Error("保存できませんでした\n"+await r.text());}

      // ===== 画面 =====
      function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

      async function renderTop(){
        if(!deviceOK()){
          $("app").innerHTML='<div class="card gate"><h1>この端末では打刻できません</h1><p class="sub">店舗の登録された端末で打刻してください。<br>（店長へ：管理画面→「打刻できる場所(IP)」→「この端末を打刻OKにする」で登録）</p></div>';
          return;
        }
        $("app").innerHTML='<div class="card"><h1>名前を選んでください</h1><div id="list"><div class="hint">読み込み中…</div></div></div>';
        try{ staff=await loadStaff(); }catch(e){ $("list").innerHTML='<div class="hint">読み込みに失敗しました</div>'; return; }
        const list=$("list");
        if(!staff.length){ list.innerHTML='<div class="hint">管理画面でスタッフを登録してください</div>'; return; }
        list.innerHTML="";
        for(const s of staff){
          const row=document.createElement("div");row.className="staff-row";
          const b=document.createElement("button");b.className="staff-btn";b.textContent=s.name+(s.pin?" 🔒":"");
          b.onclick=()=>gate(s,"punch");
          const hb=document.createElement("button");hb.className="hist-btn";hb.textContent="履歴";hb.onclick=()=>gate(s,"history");
          row.appendChild(b);row.appendChild(hb);list.appendChild(row);
        }
      }

      function gate(s,mode){ if(s.pin){ renderPin(s,mode); } else { mode==="punch"?renderPunch(s):renderHistory(s); } }

      function renderPin(s,mode){
        let entered="";
        $("app").innerHTML='<div class="card"><span class="link" id="back">← 戻る</span><div class="big-name">'+esc(s.name)+'</div><div class="sub">PINを入力してください</div><div class="pin-dots" id="dots"></div><div class="keypad" id="kp"></div><div id="pmsg" class="msg"></div></div>';
        $("back").onclick=renderTop;
        const kp=$("kp");
        ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{
          if(k==="←"){entered=entered.slice(0,-1);}
          else if(k==="OK"){ if(entered===String(s.pin)){ mode==="punch"?renderPunch(s):renderHistory(s); } else { $("pmsg").className="msg err";$("pmsg").textContent="PINが違います";entered="";} }
          else if(entered.length<8){entered+=k;}
          $("dots").textContent="●".repeat(entered.length);
        };kp.appendChild(b);});
      }

      async function renderPunch(s){
        $("app").innerHTML='<div class="card"><span class="link" id="back">← 戻る</span><div class="big-name">'+esc(s.name)+'</div><div id="body"><div class="hint">読み込み中…</div></div><div id="msg" class="msg"></div></div>';
        $("back").onclick=renderTop;
        let rec; try{ rec=await getToday(s.name); }catch(e){ $("body").innerHTML='<div class="hint">取得に失敗しました</div>'; return; }
        drawPunch(s,rec);
      }

      function stateOf(rec){
        const n=(rec&&rec.slots)||{};
        if(!n.in) return "before";
        const br=n.breaks||[];
        if(br.length&&br[br.length-1].e==null) return "onbreak";
        if(n.out) return "done";
        return "working";
      }

      function drawPunch(s,rec){
        const n=(rec&&rec.slots)||{};const st=stateOf(rec);const body=$("body");
        let badge={before:['b-before','出勤前'],working:['b-work','勤務中'],onbreak:['b-break','休憩中'],done:['b-done','退勤済み']}[st];
        let info='<div class="status"><span class="badge '+badge[0]+'">'+badge[1]+'</span><br>';
        if(n.in)info+='<span class="lbl">出勤</span> '+n.in+'　';
        const br=n.breaks||[];
        if(br.length){info+='<br><span class="lbl">休憩</span> '+br.map(b=>b.s+(b.e?"〜"+b.e:"〜(中)")).join(" / ");}
        if(n.out)info+='<br><span class="lbl">退勤</span> '+n.out;
        if(n.in&&n.out)info+='<br><span class="lbl">実働</span> <b>'+fmtHM(workMin(rec))+'</b>';
        info+='</div>';
        let btns="";
        if(st==="before"){ btns='<button class="btn-green" id="in">出勤</button>'; }
        else if(st==="working"){ btns='<div class="row2"><button class="btn-amber" id="bs">休憩に入る</button><button class="btn-red" id="out">退勤</button></div>'; }
        else if(st==="onbreak"){ btns='<button class="btn-green" id="be">休憩から戻る</button>'; }
        else if(st==="done"){ btns='<div class="hint">本日の打刻は完了しています。おつかれさまでした！</div><button class="btn-gray" id="home">トップに戻る</button>'; }
        body.innerHTML=info+btns;
        const act=async(fn)=>{try{await fn();const r=await getToday(s.name);drawPunch(s,r);flash("打刻しました");}catch(e){err(e.message);}};
        if($("in"))$("in").onclick=()=>act(()=>saveRec(s.name,{in:nowHM(),out:null,breaks:[]}));
        if($("bs"))$("bs").onclick=()=>act(()=>{const b=(n.breaks||[]).slice();b.push({s:nowHM(),e:null});return saveRec(s.name,Object.assign({},n,{breaks:b}));});
        if($("be"))$("be").onclick=()=>act(()=>{const b=(n.breaks||[]).slice();b[b.length-1]=Object.assign({},b[b.length-1],{e:nowHM()});return saveRec(s.name,Object.assign({},n,{breaks:b}));});
        if($("out"))$("out").onclick=()=>act(()=>saveRec(s.name,Object.assign({},n,{out:nowHM()})));
        if($("home"))$("home").onclick=renderTop;
      }
      function flash(t){const m=$("msg");if(!m)return;m.className="msg ok";m.textContent=t;setTimeout(()=>{if(m)m.className="msg";},2500);}
      function err(t){const m=$("msg");if(!m)return;m.className="msg err";m.textContent=t;}

      async function renderHistory(s){
        $("app").innerHTML='<div class="card"><span class="link" id="back">← 戻る</span><div class="big-name">'+esc(s.name)+'</div><div class="sub">'+todayStr().slice(0,7).replace("-","年")+'月の勤務履歴</div><div id="body"><div class="hint">読み込み中…</div></div></div>';
        $("back").onclick=renderTop;
        let recs;try{recs=await getMonth(s.name);}catch(e){$("body").innerHTML='<div class="hint">取得に失敗しました</div>';return;}
        const days=recs.filter(r=>workMin(r)>0).length;
        const total=recs.reduce((a,r)=>a+workMin(r),0);
        let html='<div class="row2" style="margin-bottom:12px"><div class="status" style="flex:1;text-align:center;margin:0"><span class="lbl">出勤日数</span><br><b style="font-size:20px">'+days+'日</b></div><div class="status" style="flex:1;text-align:center;margin:0"><span class="lbl">合計勤務時間</span><br><b style="font-size:20px">'+fmtHM(total)+'</b></div></div>';
        if(!recs.length){html+='<div class="hint">まだ記録がありません</div>';}
        else{html+='<table><thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th></tr></thead><tbody>';
          for(const r of recs){const n=r.slots||{};let inT=n.in||n.am_in||"—";let outT=n.out||n.pm_out||n.am_out||"—";
            let brk="—";if(Array.isArray(n.breaks)&&n.breaks.length){let bm=0;for(const b of n.breaks){const bs=toMin(b.s),be=toMin(b.e);if(bs!=null&&be!=null)bm+=Math.max(0,be-bs);}brk=bm?fmtHM(bm):"—";}else if(n.break_min){brk=fmtHM(Number(n.break_min));}
            html+='<tr><td>'+esc(r.date.slice(5))+'</td><td>'+esc(inT)+'</td><td>'+esc(outT)+'</td><td>'+brk+'</td><td>'+fmtHM(workMin(r))+'</td></tr>';}
          html+='</tbody></table>';}
        $("body").innerHTML=html;
      }

      renderTop();
    </script>
  </body>
</html>
